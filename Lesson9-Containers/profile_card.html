<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Profile Card</title>
    <style>
.card {
    width: 300px;
    padding: 20px;
    border: 1px solid black;
}

.tag {
    background-color: lightblue;
    padding: 5px;
}

.years {
    font-weight: bold;
}

.btn {
    background-color: blue;
    color: white;
    padding: 10px;
}
    </style>
</head>
<body>
    <div class="card">
        <h2>Emre Gemici</h2>
        <p>
            <span class="tag">Full Stack</span>
            <span class="tag">JavaScript</span>
        </p>
        <p>Experience: <span class="years">5 years</span></p>
        <button class="btn">View Profile</button>
    </div>
</body>
</html>
